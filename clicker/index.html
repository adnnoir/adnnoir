<title>ADN Noir</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    --ink: #0e0f22;
    --panel: #17193a;
    --panel2: #1f2249;
    --line: #2d3063;
    --text: #eeedff;
    --muted: #9c9ed0;
    --pink: #ff5c8a;
    --mint: #55e6c6;
    --gold: #ffc94d;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--ink);
    background-image:
      radial-gradient(circle at 25% 15%, rgba(255, 92, 138, .09), transparent 42%),
      radial-gradient(circle at 85% 85%, rgba(85, 230, 198, .08), transparent 45%);
    background-attachment: fixed;
    color: var(--text);
    font: 500 15px/1.5 var(--body);
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 96px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* En-tête */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .brand h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(30px, 6vw, 46px);
    letter-spacing: -.02em;
    line-height: 1;
    margin: 0;
  }
  .brand h1 span { color: var(--pink); }
  .brand p {
    margin: 6px 0 0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .14em;
    font-size: 12px;
    font-weight: 800;
  }
  .counter { text-align: right; }
  #adn {
    display: block;
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(32px, 7vw, 54px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .counter small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
  #cps { font-family: var(--mono); color: var(--mint); font-size: 14px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 20px; align-items: start; }
  @media (max-width: 780px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .counter { text-align: left; }
  }

  /* Zone de clic */
  .lab { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-block: 12px; }
  .cellwrap { animation: breathe 3.2s ease-in-out infinite; max-width: 100%; }
  @keyframes breathe { 50% { transform: scale(1.025); } }
  #cell {
    display: block;
    width: min(70vw, 290px);
    max-width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    background: radial-gradient(circle at 36% 30%, #3d3183, #1c1848 58%, #110e30);
    box-shadow:
      0 0 0 6px rgba(255, 92, 138, .2),
      0 0 0 16px rgba(85, 230, 198, .07),
      0 24px 70px rgba(0, 0, 0, .55),
      inset 0 0 50px rgba(255, 92, 138, .28);
    transition: transform .08s ease-out, box-shadow .2s;
    touch-action: manipulation;
  }
  #cell:hover {
    box-shadow:
      0 0 0 6px rgba(255, 92, 138, .35),
      0 0 0 16px rgba(85, 230, 198, .12),
      0 24px 70px rgba(0, 0, 0, .55),
      inset 0 0 60px rgba(255, 92, 138, .38);
  }
  #cell.pop { transform: scale(.94); }
  #cell:focus-visible { outline: 3px solid var(--gold); outline-offset: 8px; }
  #cell canvas { width: 100%; height: 100%; display: block; }

  .hint { margin: 0; color: var(--muted); text-align: center; }
  .hint b { color: var(--text); font-family: var(--mono); }

  .frenzy {
    background: linear-gradient(90deg, var(--gold), var(--pink));
    color: #1d0f14;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 440px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .stat span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
  .stat b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; overflow-wrap: anywhere; }

  /* Boutique */
  .shop { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .shop h2 {
    font-family: var(--display);
    font-size: 19px;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .shop h2 small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 700; }
  .ups { display: flex; flex-wrap: wrap; gap: 8px; }
  .ups .empty { color: var(--muted); font-size: 13px; margin: 0; }
  .up {
    flex: 1 1 150px;
    text-align: left;
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font: inherit;
    transition: border-color .15s;
  }
  .up b { display: block; font-size: 14px; }
  .up span { display: block; font-size: 12px; color: var(--muted); }
  .up .price { color: var(--gold); font-family: var(--mono); font-size: 13px; margin-top: 4px; }

  .items { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 12px;
    align-items: center;
    text-align: left;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    transition: border-color .15s, transform .08s;
  }
  .item .name { font-weight: 800; }
  .item .desc { font-size: 12px; color: var(--muted); }
  .item .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 12px; margin-top: 2px; }
  .item .price { color: var(--gold); }
  .item .rate { color: var(--mint); }
  .item .own {
    grid-column: 2;
    grid-row: 1 / 4;
    font-family: var(--display);
    font-weight: 800;
    font-size: 30px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 1.5ch;
    text-align: right;
  }
  .up:not(:disabled):hover, .item:not(:disabled):hover { border-color: var(--mint); }
  .item:not(:disabled):active, .up:not(:disabled):active { transform: scale(.985); }
  .up:disabled, .item:disabled { opacity: .45; cursor: not-allowed; }
  .item.locked .name { letter-spacing: .2em; }
  .up:focus-visible, .item:focus-visible, .ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .reset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font: inherit; font-weight: 700; cursor: pointer; }
  .ghost:hover { color: var(--text); }
  .ghost.danger { border-color: var(--pink); color: var(--pink); }

  /* Effets */
  .float {
    position: fixed;
    pointer-events: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    color: var(--mint);
    text-shadow: 0 2px 10px rgba(0, 0, 0, .7);
    transform: translate(-50%, -50%);
    animation: rise .9s ease-out forwards;
    z-index: 5;
    white-space: nowrap;
  }
  .float.gold { color: var(--gold); font-size: 22px; }
  @keyframes rise { to { opacity: 0; transform: translate(-50%, -170%); } }

  #golden {
    position: fixed;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 0;
    padding: 0;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff5cc, var(--gold) 45%, #d7870f);
    box-shadow: 0 0 26px var(--gold), 0 0 70px rgba(255, 201, 77, .45);
    animation: wobble 1.3s ease-in-out infinite;
    z-index: 6;
    display: grid;
    place-items: center;
  }
  #golden svg { width: 30px; height: 30px; }
  @keyframes wobble { 50% { transform: scale(1.12) rotate(12deg); } }

  .toasts {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(calc(100vw - 32px), 420px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .toast {
    background: var(--panel2);
    border: 1px solid var(--mint);
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    animation: tin .25s ease-out, tout .4s ease-in 3.4s forwards;
  }
  .toast.gold { border-color: var(--gold); }
  @keyframes tin { from { opacity: 0; transform: translateY(10px); } }
  @keyframes tout { to { opacity: 0; transform: translateY(10px); } }

  @media (prefers-reduced-motion: reduce) {
    .cellwrap, #golden { animation: none; }
    .float { animation-duration: .6s; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>ADN <span>Noir</span></h1>
      <p>Le labo clicker</p>
    </div>
    <div class="counter" aria-live="off">
      <span id="adn">0</span>
      <small>brins d’ADN</small>
      <span id="cps">0 / s</span>
    </div>
  </header>

  <main class="grid">
    <section class="lab">
      <div class="cellwrap">
        <button id="cell" type="button" aria-label="Cliquer la cellule pour extraire de l’ADN"><canvas id="helix"></canvas></button>
      </div>
      <p class="hint">Clique la cellule pour extraire de l’ADN · <b id="perclick">+1</b> par clic</p>
      <div id="frenzy" class="frenzy" hidden></div>
      <div class="stats">
        <div class="stat"><span>Total extrait</span><b id="sTotal">0</b></div>
        <div class="stat"><span>Clics</span><b id="sClicks">0</b></div>
        <div class="stat"><span>Temps de jeu</span><b id="sTime">0 s</b></div>
      </div>
    </section>

    <aside class="shop">
      <h2>Améliorations <small>achat unique</small></h2>
      <div id="upgrades" class="ups"></div>
      <h2>Équipement du labo <small>produit tout seul</small></h2>
      <div id="buildings" class="items"></div>
      <div class="reset">
        <button id="resetBtn" class="ghost" type="button">Recommencer à zéro</button>
        <span id="confirm" hidden>Tout effacer ?
          <button id="yes" class="ghost danger" type="button">Oui, effacer</button>
          <button id="no" class="ghost" type="button">Non</button>
        </span>
      </div>
    </aside>
  </main>
</div>

<button id="golden" type="button" aria-label="Mutation dorée : clique vite !" hidden>
  <svg viewBox="0 0 30 30" aria-hidden="true" fill="none" stroke="#5a2f00" stroke-width="2.4" stroke-linecap="round">
    <path d="M9 3c0 8 12 8 12 12S9 19 9 27"/><path d="M21 3c0 8-12 8-12 12s12 4 12 12"/>
    <path d="M11 8h8M11 22h8"/>
  </svg>
</button>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
(() => {
  const BUILDINGS = [
    { id: 'pipette',   name: 'Pipette',            desc: 'Aspire un brin de temps en temps.',                   cost: 15,        rate: 0.1 },
    { id: 'micro',     name: 'Microscope',         desc: 'Repère l’ADN caché dans la poussière.',              cost: 100,       rate: 1 },
    { id: 'stagiaire', name: 'Stagiaire du labo',  desc: 'Motivé, mal payé, étonnamment efficace.',            cost: 1100,      rate: 8 },
    { id: 'centri',    name: 'Centrifugeuse',      desc: 'Fait tourner les cellules jusqu’à ce qu’elles lâchent tout.', cost: 12000, rate: 47 },
    { id: 'clone',     name: 'Salle de clonage',   desc: 'Des cellules qui fabriquent des cellules.',          cost: 130000,    rate: 260 },
    { id: 'seq',       name: 'Séquenceur géant',   desc: 'Lit 3 milliards de bases avant le petit-déj.',       cost: 1.4e6,     rate: 1400 },
    { id: 'mutant',    name: 'Mutant noir',        desc: 'Personne ne sait d’où il vient. Mais il produit.',   cost: 2e7,       rate: 7800 },
    { id: 'planete',   name: 'Planète-labo',       desc: 'Une planète entière transformée en paillasse.',      cost: 3.3e8,     rate: 44000 },
  ];
  const UPGRADES = [
    { id: 'gants',    name: 'Gants en latex',     desc: 'Clic ×2',                              cost: 50,    type: 'click', val: 2 },
    { id: 'doigts',   name: 'Doigts de fée',      desc: 'Clic ×2',                              cost: 600,   type: 'click', val: 2 },
    { id: 'cafe',     name: 'Machine à café',     desc: 'Production ×1,5',                      cost: 2000,  type: 'prod',  val: 1.5 },
    { id: 'scalpel',  name: 'Scalpel laser',      desc: 'Chaque clic ajoute 2 % de ta prod/s',  cost: 8000,  type: 'pct',   val: 0.02 },
    { id: 'titane',   name: 'Gants en titane',    desc: 'Clic ×3',                              cost: 25000, type: 'click', val: 3 },
    { id: 'uv',       name: 'Lampes UV',          desc: 'Production ×2',                        cost: 90000, type: 'prod',  val: 2 },
    { id: 'crispr',   name: 'Ciseaux CRISPR',     desc: 'Production ×2',                        cost: 1.5e6, type: 'prod',  val: 2 },
    { id: 'quantique',name: 'Scalpel quantique',  desc: 'Chaque clic ajoute 5 % de ta prod/s',  cost: 5e6,   type: 'pct',   val: 0.05 },
    { id: 'noir',     name: 'ADN noir pur',       desc: 'Production ×3',                        cost: 8e7,   type: 'prod',  val: 3 },
  ];
  const countB = s => Object.values(s.owned).reduce((a, b) => a + b, 0);
  const ACH = [
    ['c1',   s => s.clicks >= 1,     'Premier clic ! La science commence.'],
    ['c100', s => s.clicks >= 100,   '100 clics. Ton doigt prend du muscle.'],
    ['c1k',  s => s.clicks >= 1000,  '1 000 clics. Tendinite en approche.'],
    ['b1',   s => countB(s) >= 1,    'Premier équipement acheté. Le labo prend vie.'],
    ['b25',  s => countB(s) >= 25,   '25 équipements. Ça commence à être serré.'],
    ['b100', s => countB(s) >= 100,  '100 équipements. Il faut pousser les murs.'],
    ['t1k',  s => s.total >= 1e3,    '1 000 brins d’ADN extraits.'],
    ['t1m',  s => s.total >= 1e6,    'Un million de brins ! Tu deviens connu.'],
    ['t1md', s => s.total >= 1e9,    'Un milliard. Officiellement savant fou.'],
  ];

  const KEY = 'adn-noir-save-v1';
  const FRENZY_MULT = 7;
  const fresh = () => ({ adn: 0, total: 0, clicks: 0, played: 0, owned: {}, ups: [], ach: [], last: Date.now() });
  let state = fresh();
  let frenzyUntil = 0;
  let nextGolden = Date.now() + rand(30, 60) * 1000;
  let goldenHideAt = 0;

  const $ = id => document.getElementById(id);
  function rand(a, b) { return a + Math.random() * (b - a); }

  // ---------- Formatage ----------
  const SUF = ['', 'k', 'M', 'Md', 'Bn', 'Bd', 'Tn', 'Td'];
  function fmt(n, dec) {
    if (!isFinite(n)) return '∞';
    if (n < 1000) {
      if (dec && n < 100 && Math.abs(n % 1) > 1e-9) return n.toFixed(1).replace('.', ',');
      return String(Math.floor(n));
    }
    let i = 0;
    while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; }
    const s = n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : String(Math.floor(n));
    return s.replace('.', ',') + ' ' + SUF[i];
  }
  function fmtTime(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + ' s';
    const m = Math.floor(sec / 60);
    if (m < 60) return m + ' min';
    const h = Math.floor(m / 60);
    return h + ' h ' + String(m % 60).padStart(2, '0');
  }

  // ---------- Calculs ----------
  const has = id => state.ups.includes(id);
  function mults() {
    let click = 1, prod = 1, pct = 0;
    for (const u of UPGRADES) if (has(u.id)) {
      if (u.type === 'click') click *= u.val;
      else if (u.type === 'prod') prod *= u.val;
      else pct += u.val;
    }
    return { click, prod, pct };
  }
  function baseCps() {
    const m = mults();
    let c = 0;
    for (const b of BUILDINGS) c += (state.owned[b.id] || 0) * b.rate;
    return c * m.prod;
  }
  const frenzy = () => Date.now() < frenzyUntil;
  const cps = () => baseCps() * (frenzy() ? FRENZY_MULT : 1);
  function clickValue() {
    const m = mults();
    return (m.click + baseCps() * m.pct) * (frenzy() ? FRENZY_MULT : 1);
  }
  const priceOf = b => Math.ceil(b.cost * Math.pow(1.15, state.owned[b.id] || 0));

  // ---------- Sauvegarde ----------
  function save() {
    try { state.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return Object.assign(fresh(), JSON.parse(raw));
    } catch (e) {}
    return null;
  }

  // ---------- Effets ----------
  function toast(msg, gold) {
    const t = document.createElement('div');
    t.className = 'toast' + (gold ? ' gold' : '');
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3900);
  }
  function floater(x, y, text, gold) {
    const f = document.createElement('div');
    f.className = 'float' + (gold ? ' gold' : '');
    f.textContent = text;
    f.style.left = (x + rand(-18, 18)) + 'px';
    f.style.top = (y + rand(-10, 10)) + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 950);
  }

  // ---------- Double hélice ----------
  const cv = $('helix'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, phase = 0, lastDraw = 0;
  function sizeCanvas() {
    const r = cv.getBoundingClientRect();
    const d = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.max(1, Math.round(W * d));
    cv.height = Math.max(1, Math.round(H * d));
    ctx.setTransform(d, 0, 0, d, 0, 0);
    drawHelix(0, 0, true);
  }
  function dot(x, y, r, color, a) {
    ctx.globalAlpha = a;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawHelix(dt, c, force) {
    if (!W) return;
    if (reduce && !force) {
      const now = performance.now();
      if (now - lastDraw < 1000) return;
      lastDraw = now;
    }
    phase += dt * (0.9 + Math.log10(1 + c) * 0.4);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.4);
    const R = W * 0.2, step = W / 20;
    for (let y = -H * 0.62; y <= H * 0.62; y += step) {
      const p = (y / W) * 9.5 + phase * 2;
      const s = Math.sin(p), z = Math.cos(p);
      const x1 = s * R, x2 = -s * R;
      ctx.globalAlpha = 0.14 + 0.2 * Math.abs(z);
      ctx.strokeStyle = '#eeedff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      const f1 = (z + 1) / 2, f2 = 1 - f1;
      dot(x1, y, 2.5 + 3.5 * f1, '#ff5c8a', 0.35 + 0.65 * f1);
      dot(x2, y, 2.5 + 3.5 * f2, '#55e6c6', 0.35 + 0.65 * f2);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  if ('ResizeObserver' in window) new ResizeObserver(sizeCanvas).observe(cv);
  else addEventListener('resize', sizeCanvas);

  // ---------- Boutique ----------
  const bEls = {};
  function buildShop() {
    const wrap = $('buildings');
    wrap.textContent = '';
    for (const b of BUILDINGS) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'item';
      el.innerHTML = '<span class="name"></span><span class="desc"></span><span class="meta"><span class="price"></span><span class="rate"></span></span><span class="own"></span>';
      el.addEventListener('click', () => buyBuilding(b));
      wrap.appendChild(el);
      bEls[b.id] = {
        el,
        name: el.querySelector('.name'),
        desc: el.querySelector('.desc'),
        price: el.querySelector('.price'),
        rate: el.querySelector('.rate'),
        own: el.querySelector('.own'),
      };
    }
  }
  function buyBuilding(b) {
    const p = priceOf(b);
    if (state.adn < p) return;
    state.adn -= p;
    state.owned[b.id] = (state.owned[b.id] || 0) + 1;
    updateShop();
    updateTop();
  }
  function buyUpgrade(u) {
    if (has(u.id) || state.adn < u.cost) return;
    state.adn -= u.cost;
    state.ups.push(u.id);
    toast(u.name + ' : ' + u.desc);
    upKey = '';
    updateShop();
    updateTop();
  }

  let upKey = '';
  function updateShop() {
    const m = mults();
    let shownLocked = false;
    for (const b of BUILDINGS) {
      const e = bEls[b.id];
      const owned = state.owned[b.id] || 0;
      const p = priceOf(b);
      const unlocked = owned > 0 || state.total >= b.cost * 0.4 || b.cost <= 15;
      if (!unlocked && shownLocked) { e.el.hidden = true; continue; }
      e.el.hidden = false;
      if (!unlocked) shownLocked = true;
      e.el.classList.toggle('locked', !unlocked);
      e.name.textContent = unlocked ? b.name : '???';
      e.desc.textContent = unlocked ? b.desc : 'Continue d’extraire pour débloquer.';
      e.price.textContent = fmt(p) + ' ADN';
      e.rate.textContent = unlocked ? '+' + fmt(b.rate * m.prod, true) + '/s chacun' : '';
      e.own.textContent = owned || '';
      e.el.disabled = !unlocked || state.adn < p;
    }

    const avail = UPGRADES.filter(u => !has(u.id) && state.total >= u.cost * 0.5).slice(0, 4);
    const key = avail.map(u => u.id).join(',');
    const wrap = $('upgrades');
    if (key !== upKey) {
      upKey = key;
      wrap.textContent = '';
      if (!avail.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = state.ups.length === UPGRADES.length
          ? 'Tout est acheté. Respect.'
          : 'Rien pour l’instant. Continue d’extraire…';
        wrap.appendChild(p);
      }
      for (const u of avail) {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'up';
        el.dataset.id = u.id;
        el.innerHTML = '<b></b><span></span><span class="price"></span>';
        el.children[0].textContent = u.name;
        el.children[1].textContent = u.desc;
        el.children[2].textContent = fmt(u.cost) + ' ADN';
        el.addEventListener('click', () => buyUpgrade(u));
        wrap.appendChild(el);
      }
    }
    for (const el of wrap.querySelectorAll('.up')) {
      const u = UPGRADES.find(x => x.id === el.dataset.id);
      el.disabled = state.adn < u.cost;
    }
  }

  function updateTop() {
    $('adn').textContent = fmt(state.adn);
    $('cps').textContent = fmt(cps(), true) + ' / s';
    $('perclick').textContent = '+' + fmt(clickValue(), true);
    $('sTotal').textContent = fmt(state.total);
    $('sClicks').textContent = fmt(state.clicks);
    $('sTime').textContent = fmtTime(state.played);
    const fz = $('frenzy');
    if (frenzy()) {
      fz.hidden = false;
      fz.textContent = 'Mutation ! Tout ×' + FRENZY_MULT + ' · ' + Math.ceil((frenzyUntil - Date.now()) / 1000) + ' s';
    } else fz.hidden = true;
  }

  function checkAch() {
    for (const [id, test, msg] of ACH) {
      if (!state.ach.includes(id) && test(state)) {
        state.ach.push(id);
        toast(msg);
      }
    }
  }

  // ---------- Mutation dorée ----------
  const golden = $('golden');
  function goldenTick() {
    const now = Date.now();
    if (golden.hidden && now >= nextGolden) {
      const size = 58, m = 24;
      golden.style.left = rand(m, Math.max(m, innerWidth - size - m)) + 'px';
      golden.style.top = rand(m + 60, Math.max(m + 60, innerHeight - size - m - 60)) + 'px';
      golden.hidden = false;
      goldenHideAt = now + 9000;
    } else if (!golden.hidden && now >= goldenHideAt) {
      golden.hidden = true;
      nextGolden = now + rand(40, 90) * 1000;
    }
  }
  golden.addEventListener('click', e => {
    golden.hidden = true;
    nextGolden = Date.now() + rand(40, 90) * 1000;
    const r = golden.getBoundingClientRect();
    const x = e.clientX || r.left + r.width / 2, y = e.clientY || r.top + r.height / 2;
    if (Math.random() < 0.5 && baseCps() > 0) {
      frenzyUntil = Date.now() + 15000;
      toast('Mutation dorée ! Tout est ×' + FRENZY_MULT + ' pendant 15 s', true);
      floater(x, y, '×' + FRENZY_MULT + ' !', true);
    } else {
      const gain = Math.max(25, baseCps() * 60 + clickValue() * 15);
      state.adn += gain; state.total += gain;
      toast('Jackpot génétique : +' + fmt(gain) + ' ADN', true);
      floater(x, y, '+' + fmt(gain), true);
    }
    if (!state.ach.includes('gold')) { state.ach.push('gold'); }
    updateTop();
  });

  // ---------- Clic principal ----------
  const cell = $('cell');
  cell.addEventListener('click', e => {
    const v = clickValue();
    state.adn += v; state.total += v; state.clicks++;
    let x = e.clientX, y = e.clientY;
    if (!x && !y) { const r = cell.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    floater(x, y, '+' + fmt(v, true));
    cell.classList.remove('pop');
    void cell.offsetWidth;
    cell.classList.add('pop');
    setTimeout(() => cell.classList.remove('pop'), 90);
    updateTop();
  });

  // ---------- Recommencer ----------
  $('resetBtn').addEventListener('click', () => { $('confirm').hidden = false; $('resetBtn').hidden = true; });
  $('no').addEventListener('click', () => { $('confirm').hidden = true; $('resetBtn').hidden = false; });
  $('yes').addEventListener('click', () => {
    state = fresh(); frenzyUntil = 0; upKey = '';
    $('confirm').hidden = true; $('resetBtn').hidden = false;
    save(); updateShop(); updateTop();
    toast('Nouveau labo, nouvelle vie.');
  });

  // ---------- Boucle ----------
  let lastT = performance.now(), acc = 0, saveAcc = 0, hiddenAt = 0;
  function frame(t) {
    const dt = Math.min(1, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    const c = cps();
    state.adn += c * dt; state.total += c * dt; state.played += dt;
    drawHelix(dt, c);
    updateTop();
    acc += dt; saveAcc += dt;
    if (acc > 0.2) { acc = 0; updateShop(); checkAch(); goldenTick(); }
    if (saveAcc > 5) { saveAcc = 0; save(); }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); }
    else if (hiddenAt) {
      const sec = Math.min((Date.now() - hiddenAt) / 1000, 8 * 3600);
      const gain = sec * baseCps();
      state.adn += gain; state.total += gain;
      hiddenAt = 0; lastT = performance.now();
    }
  });
  addEventListener('pagehide', save);

  function start(data) {
    const restored = data && data.state ? Object.assign(fresh(), data.state) : null;
    const saved = restored || load();
    if (saved) {
      state = saved;
      if (!restored) {
        const sec = Math.min((Date.now() - (state.last || Date.now())) / 1000, 8 * 3600);
        const gain = sec * baseCps() * 0.5;
        if (sec > 30 && gain >= 1) {
          state.adn += gain; state.total += gain;
          setTimeout(() => toast('Pendant ton absence, le labo a produit +' + fmt(gain) + ' ADN'), 400);
        }
      }
    } else {
      // Petite démo : l’écran d’accueil montre déjà la boutique en action
      setTimeout(() => toast('Clique la cellule pour commencer !'), 400);
    }
    buildShop();
    sizeCanvas();
    updateShop();
    updateTop();
    requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
  }

  try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (e) {}
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
